<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="Contact Yasser Alrajeh" name="description"/>
<title>Contact | Yasser Alrajeh</title>
<style>
    :root{--azure:#0078d4;--azure-light:#50a7e8;--azure-dark:#005a9e;--bg:#08111f;--surface:#11233a;--text:#f5f9ff;--muted:#a9bad0;--border:rgba(139,190,232,.22);--shadow:0 22px 60px rgba(0,0,0,.30)}
    *{box-sizing:border-box;margin:0;padding:0}
    html{color-scheme:dark}
    body{min-height:100vh;display:flex;flex-direction:column;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 15% 0%,rgba(0,120,212,.18),transparent 34rem),var(--bg);line-height:1.6}
    a{color:inherit;text-decoration:none}.container{width:min(92%,1120px);margin-inline:auto}
    header{border-bottom:1px solid var(--border);background:rgba(8,17,31,.88);backdrop-filter:blur(16px)}
    nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .brand{font-weight:750}.back{color:var(--muted);font-size:.9rem;font-weight:650}.back:hover{color:var(--text)}
    main{flex:1;display:grid;place-items:center;padding:64px 0 76px}.contact-wrap{width:min(92%,680px);margin-inline:auto}
    .intro{text-align:center;margin-bottom:32px}.eyebrow{color:var(--azure-light);font-size:.8rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;margin-bottom:9px}
    h1{font-size:clamp(2.2rem,6vw,3.45rem);line-height:1.08;letter-spacing:-.045em}.intro p{color:var(--muted);margin-top:12px;font-size:1rem}
    form{display:grid;gap:18px;padding:30px;border:1px solid var(--border);border-radius:20px;background:linear-gradient(145deg,rgba(17,35,58,.97),rgba(13,27,46,.97));box-shadow:var(--shadow)}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:grid;gap:7px}label{font-size:.9rem;font-weight:700}
    input,textarea{display:block;width:100%;min-width:0;border:1px solid var(--border);border-radius:10px;background:#0a1728;color:var(--text);padding:13px 14px;font:inherit;outline:none;appearance:none}
    input{height:50px}textarea{min-height:180px;resize:vertical}
    input::placeholder,textarea::placeholder{color:#7890aa}input:focus,textarea:focus{border-color:var(--azure-light);box-shadow:0 0 0 3px rgba(0,120,212,.18)}
    button{width:100%;min-height:50px;border:0;border-radius:10px;color:#fff;background:linear-gradient(135deg,var(--azure),var(--azure-light));font:inherit;font-weight:800;cursor:pointer;box-shadow:0 10px 28px rgba(0,120,212,.24)}button:hover{background:linear-gradient(135deg,var(--azure-dark),var(--azure))}
    .bot{position:absolute;left:-9999px;opacity:0;pointer-events:none}
    footer{border-top:1px solid var(--border);color:var(--muted);text-align:center;padding:25px 0;font-size:.85rem}
    @media(max-width:640px){main{padding:44px 0 58px}.two{grid-template-columns:1fr}.contact-wrap{width:min(94%,680px)}form{padding:22px 18px;border-radius:16px}nav{min-height:66px}.back{font-size:.8rem}}
  </style>
<link href="assets/css/portfolio-enhancements.css" rel="stylesheet"/></head>
<body>
<header><nav class="container"><a class="brand" href="index.html">Yasser Alrajeh</a><a class="back" href="index.html">← Back to Home</a></nav></header>
<main>
<div class="contact-wrap">
<div class="intro"><div class="eyebrow">Get in Touch</div><h1>Contact Me</h1><p>Send me a message and I will get back to you soon.</p></div>
<form action="https://api.web3forms.com/submit" method="POST">
<input name="access_key" type="hidden" value="fd6280ae-131a-4ada-a21b-ebcbbab0f07c"/>
<input name="subject" type="hidden" value="New Contact Message from Yasser Alrajeh Portfolio"/>
<input name="from_name" type="hidden" value="Yasser Alrajeh Portfolio"/>
<input name="redirect" type="hidden" value="https://yasseralrajeh.com/thanks.html"/>
<input autocomplete="off" class="bot" name="botcheck" tabindex="-1" type="checkbox"/>
<div class="two">
<div class="field"><label for="name">Name</label><input id="name" name="name" placeholder="Your name" required="" type="text"/></div>
<div class="field"><label for="email">Email</label><input id="email" name="email" placeholder="you@example.com" required="" type="email"/></div>
</div>
<div class="field"><label for="message-subject">Subject</label><input id="message-subject" name="message_subject" placeholder="Message subject" required="" type="text"/></div>
<div class="field"><label for="message">Message</label><textarea id="message" name="message" placeholder="Write your message here" required=""></textarea></div>
<button type="submit">Send Message</button>
</form>
</div>
</main>
<footer>© <span id="year"></span> Yasser Alrajeh</footer>
<script>document.getElementById('year').textContent=new Date().getFullYear();</script>
</body>
</html>
